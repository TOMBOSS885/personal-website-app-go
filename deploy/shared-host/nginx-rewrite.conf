# Paste these rules into the hosting panel's Nginx rewrite/pseudo-static setting.
# The order matters: protect private files, route the API, then fall back to React.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/octet-stream image/svg+xml;

add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'sha256-YSrAb8iIwZP/5DKDH/s4MXKZZ7IMyUSz3G3JYyi70q0=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'" always;

# Keep ACME challenges reachable while denying repositories, environment files,
# editor backups, database dumps, and deployment-only material.
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
}

location ~* /(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|phpunit\.xml(?:\.dist)?|web\.config)$ {
    deny all;
}

location ~* \.(?:bak|conf|dist|env|ini|log|old|orig|pem|key|sql|sqlite3?|swp|ya?ml)(?:\.|$) {
    deny all;
}

location ^~ /app/ {
    deny all;
}

location ^~ /config/ {
    deny all;
}

location ^~ /migrations/ {
    deny all;
}

location ^~ /server-config/ {
    deny all;
}

location = /uploads/article-sites {
    return 404;
}

location ^~ /uploads/article-sites/ {
    return 404;
}

location ^~ /uploads/ {
    # Uploads are data only. Block executable/active web types even when an
    # older PHP handler or a misconfigured host would otherwise serve them.
    if ($uri ~* "(?:/|^)[^/]*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh|bash|exe|bat|cmd|html?|shtml|xhtml|js|mjs|css|svgz?|xml|xsl)$") {
        return 403;
    }
    if ($uri ~* "/\.") {
        return 403;
    }
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    try_files $uri =404;
}

location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-YSrAb8iIwZP/5DKDH/s4MXKZZ7IMyUSz3G3JYyi70q0=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'" always;
    try_files $uri =404;
}

location = /robots.txt {
    rewrite ^ /api/index.php?route=robots.txt last;
}

location = /sitemap.xml {
    rewrite ^ /api/index.php?route=sitemap.xml last;
}

location = /feed.xml {
    rewrite ^ /api/index.php?route=feed.xml last;
}

location = /atom.xml {
    rewrite ^ /api/index.php?route=atom.xml last;
}

# Signed static-article assets end in .css/.js/image extensions. This more
# specific prefix must win over the hosting provider's global static-file
# regex, otherwise those requests bypass PHP and return an Nginx 404.
location ^~ /api/public/article-sites/ {
    rewrite ^/api/?(.*)$ /api/index.php?route=$1 last;
}

# The internal rewrite above lands on this exact PHP entrypoint. Define the
# security headers here so the site's global CSP is not combined with the
# per-document CSP emitted by the static-article handler.
location = /api/index.php {
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
}

location = /api {
    rewrite ^ /api/index.php?route= last;
}

location /api/ {
    rewrite ^/api/?(.*)$ /api/index.php?route=$1 last;
}

location / {
    try_files $uri $uri/ /index.html;
}
