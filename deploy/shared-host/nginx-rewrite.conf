# Paste these rules into the hosting panel's Nginx rewrite/pseudo-static setting.
# The order matters: protect private files, route the API, then fall back to React.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/octet-stream image/svg+xml;

location ^~ /app/ {
    deny all;
}

location ^~ /config/ {
    deny all;
}

location ^~ /migrations/ {
    deny all;
}

location = /uploads/article-sites {
    return 404;
}

location ^~ /uploads/article-sites/ {
    return 404;
}

location ^~ /uploads/ {
    if ($uri ~* "\.(?:php[0-9]?|phtml|phar)$") {
        return 403;
    }
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /api {
    rewrite ^ /api/index.php?route= last;
}

location /api/ {
    rewrite ^/api/?(.*)$ /api/index.php?route=$1 last;
}

location / {
    try_files $uri $uri/ /index.html;
}
